kind = "web"
previewPath = "/"
title = "Media Arts Talent Repository"
version = "1.0.0"
id = "artifacts/matr"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25940

[services.development]
run = "pnpm --filter @workspace/matr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matr", "run", "build" ]
publicDir = "artifacts/matr/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25940"
BASE_PATH = "/"
